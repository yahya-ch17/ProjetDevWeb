<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        legend,label,th,td{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: bold;
            color: rgb(255, 177, 41);   
        }
        body{
            background: none;
        }
        div{
            display: flex;
            flex-direction: column;
            justify-content: baseline;
        }
        select,input[type="reset"]{
            margin-bottom: 20px;
        }
    </style>
    <script>
        function active(){
            if(document.getElementById("ch1").checked==true){
                document.getElementById("bts").disabled=false
            }
            else{
                if(document.getElementById("ch1").checked==false){
                    document.getElementById("bts").disabled=true
                }
            }
        }
        function tout(){
            if(document.getElementById("ch3").checked==true){
                document.getElementById("ch1").checked=true
                document.getElementById("ch2").checked=true
            }
            else{
                document.getElementById("ch1").checked=false
                document.getElementById("ch2").checked=false
            }
            if((document.getElementById("ch1").checked==true)&&(document.getElementById("ch2").checked==true)){
                document.getElementById("ch3").checked=true
            }
            else{
                document.getElementById("ch3").checked=false
            }
            active()
        }
        function enregistrer(){
            np=document.getElementById("np").value
            tel=document.getElementById("tel").value
            cin=document.getElementById("cin").value
            mail=document.getElementById("mail").value
            dt=document.getElementById("dt").value
            ty=document.getElementById("ty").value
            tb=document.querySelector("tbody")
            l=tb.insertRow()
            td=l.insertCell()
            td.innerHTML=np.toUpperCase()
            td=l.insertCell()
            td.innerHTML=tel
            td=l.insertCell()
            td.innerHTML=cin
            td=l.insertCell()
            td.innerHTML=ty
            td=l.insertCell()
            td.innerHTML=mail
            d=new Date(dt)
            dy=d.getFullYear()+1
            dm=d.getMonth()+1
            dd=d.getDate()
            td=l.insertCell()
            td.innerHTML=dy+"/"+dm+"/"+dd


        }
    </script>
</head>
<body>
    <form action="">
        <fieldset>
            <legend><h3>Insérer votre informations</h3></legend>
            <div>
                <label for="" class="form-label">Nom & Prénom: </label>
                <input type="text" name="" id="np" required>
            </div>
            <div>
                <label for="" class="form-label">N° Téléphone: </label>
                <input type="text" name="" id="tel" required>
            </div>
            <div>
                <label for="" class="form-label">N° CIN: </label>
                <input type="text" name="" id="cin" required>
            </div>
            <div>
                <label for="" class="form-label">E-mail: </label>
                <input type="text" name="" id="mail" required>
            </div>
            <div>
                <label for="" class="form-label">Date ins: </label>
                <input type="date" name="" id="dt" required>
            </div>
            <div>
                <label for="" class="form-label">Type d'abonnement: </label>
                <select name="" id="ty">
                    <option value="Virage">Virage (200DT)</option>
                    <option value="Pelouse">Pelouse (220DT)</option>
                    <option value="Enceinte Supérieur">Enceinte Supérieur (450DT)</option>
                    <option value="Enceinte Inférieur">Enceinte Inférieur (650DT)</option>
                    <option value="Tribune Centrale">Tribune Centrale (950DT)</option>
                </select>
            </div>
            <input type="checkbox" name="" id="ch1" onclick="active()" onclick="tout()"><label for="" class="form-label">Accepter les conditions </label><br>
            <input type="checkbox" name="" id="ch2" onclick="tout()"><label for="" class="form-label">Recevoir des emails</label> 
            <hr>
            <input type="checkbox" name="" id="ch3" onclick="tout()"><label for="" class="form-label">Cocher tout</label>
            <div class="d-flex gap-2"><button type="button" id="bts" class="btn btn-success" onclick="enregistrer()" disabled>Enregistrer</button><input type="reset" value="Annuler" class="btn btn-danger"></div>
        </fieldset>
        <table class="table table-bordered">
            <tr>
                <th>Nom & Prénom</th>
                <th>Téléphone</th>
                <th>CIN</th>
                <th>Type D'abonnement</th>
                <th>E-mail</th>
                <th>Date exp</th>
            </tr>
        </table>
    </form>
</body>
</html>
